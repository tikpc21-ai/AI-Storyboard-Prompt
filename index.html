<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Maker: ไอเดียสร้างสื่อ Storyboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { primary: '#4f46e5', secondary: '#ec4899', accent: '#8b5cf6' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .idea-card { transition: all 0.2s ease-in-out; }
        .idea-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .idea-card.active { border-color: #4f46e5; background-color: #eef2ff; }
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 min-h-screen font-sans">
    <nav class="bg-gradient-to-r from-primary to-accent shadow-lg text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 p-2 rounded-lg backdrop-blur-sm">
                        <i class="fa-solid fa-clapperboard text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-wide">AI Storyboard Prompt</h1>
                        <p class="text-xs text-white/80 font-medium">เครื่องมือสร้างคำสั่งอัตโนมัติสำหรับคุณครู</p>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- LEFT COLUMN: Categories & Settings -->
            <div class="lg:col-span-8 flex flex-col gap-6">
                
                <!-- STEP 1: Categories -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex flex-col sm:flex-row sm:justify-between sm:items-center">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center">
                            <span class="bg-primary text-white w-6 h-6 rounded-full flex items-center justify-center text-sm mr-2 shadow-sm">1</span>
                            เลือกหมวดวิชาและระดับชั้น
                        </h2>
                        <div class="flex items-center mt-3 sm:mt-0">
                            <label class="text-sm font-medium text-slate-600 mr-2">ระดับชั้น:</label>
                            <select id="grade-level" onchange="generatePrompt()" class="bg-white border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-primary focus:border-primary block p-2 outline-none font-medium">
                                <option value="อนุบาล">อนุบาล</option>
                                <option value="ประถมศึกษาปีที่ 1" selected>ประถมศึกษาปีที่ 1</option>
                                <option value="ประถมศึกษาปีที่ 2">ประถมศึกษาปีที่ 2</option>
                                <option value="ประถมศึกษาปีที่ 3">ประถมศึกษาปีที่ 3</option>
                                <option value="ประถมศึกษาปีที่ 4">ประถมศึกษาปีที่ 4</option>
                                <option value="ประถมศึกษาปีที่ 5">ประถมศึกษาปีที่ 5</option>
                                <option value="ประถมศึกษาปีที่ 6">ประถมศึกษาปีที่ 6</option>
                                <option value="มัธยมศึกษาปีที่ 1">มัธยมศึกษาปีที่ 1</option>
                                <option value="มัธยมศึกษาปีที่ 2">มัธยมศึกษาปีที่ 2</option>
                                <option value="มัธยมศึกษาปีที่ 3">มัธยมศึกษาปีที่ 3</option>
                            </select>
                        </div>
                    </div>
                    <div class="p-6">
                        <div id="subject-container" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <!-- STEP 2: Style Settings -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center">
                            <span class="bg-primary text-white w-6 h-6 rounded-full flex items-center justify-center text-sm mr-2 shadow-sm">2</span>
                            ตั้งค่าองค์ประกอบและสไตล์ (ปรับแก้ได้)
                        </h2>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                            <!-- Column 1 -->
                            <div class="space-y-4">
                                <div class="flex flex-col text-sm">
                                    <label class="font-bold text-slate-700 mb-1">สถานที่</label>
                                    <input type="text" id="location-input" oninput="generatePrompt()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 outline-none focus:border-primary">
                                </div>
                                <div class="flex flex-col text-sm">
                                    <label class="font-bold text-slate-700 mb-1">การแต่งกาย/อุปกรณ์</label>
                                    <input type="text" id="outfit-input" oninput="generatePrompt()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 outline-none focus:border-primary">
                                </div>
                                <div class="flex flex-col text-sm">
                                    <label class="font-bold text-slate-700 mb-1">ท่าทาง (Action)</label>
                                    <input type="text" id="action-input" oninput="generatePrompt()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 outline-none focus:border-primary">
                                </div>
                            </div>
                            <!-- Column 2 -->
                            <div class="space-y-4">
                                <div class="flex flex-col text-sm">
                                    <label class="font-bold text-slate-700 mb-1">สไตล์ภาพ</label>
                                    <input type="text" id="style-input" oninput="generatePrompt()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 outline-none focus:border-primary">
                                </div>
                                <div class="flex flex-col text-sm">
                                    <label class="font-bold text-slate-700 mb-1">มุมกล้อง</label>
                                    <input type="text" id="camera-input" oninput="generatePrompt()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 outline-none focus:border-primary">
                                </div>
                                <div class="flex flex-col text-sm">
                                    <label class="font-bold text-slate-700 mb-1">แสง</label>
                                    <input type="text" id="light-input" oninput="generatePrompt()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 outline-none focus:border-primary">
                                </div>
                                <div class="flex flex-col text-sm">
                                    <label class="font-bold text-slate-700 mb-1">บรรยากาศ</label>
                                    <input type="text" id="vibe-input" oninput="generatePrompt()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 outline-none focus:border-primary">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- STEP 3: Ideas -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-grow flex flex-col">
                    <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center">
                            <span class="bg-primary text-white w-6 h-6 rounded-full flex items-center justify-center text-sm mr-2 shadow-sm">3</span>
                            เลือกไอเดีย (เรื่องและตอน)
                        </h2>
                    </div>
                    <div class="p-6 bg-slate-50/50 flex-grow">
                        <div id="ideas-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="col-span-full py-8 text-center text-slate-400 font-medium">
                                <i class="fa-solid fa-arrow-pointer mb-2 text-2xl"></i><br>
                                กรุณาเลือกหมวดวิชาด้านบนก่อน
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Output Result -->
            <div class="lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[700px] sticky top-6">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex flex-col gap-3">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center">
                        <i class="fa-solid fa-wand-magic-sparkles text-primary mr-2"></i> ผลลัพธ์พร้อมใช้งาน
                    </h2>
                    
                    <!-- Result Mode Toggle -->
                    <div class="flex bg-slate-200 rounded-lg p-1 w-full relative">
                        <div id="mode-slider" class="absolute w-[calc(50%-4px)] h-8 bg-white rounded-md shadow-sm transition-transform duration-300 left-1 top-1"></div>
                        <button id="mode-video-btn" onclick="setMode('video')" class="relative z-10 flex-1 text-xs py-1.5 font-medium text-primary transition-colors duration-300">
                            <i class="fa-solid fa-video mr-1"></i> สร้างคลิป
                        </button>
                        <button id="mode-image-btn" onclick="setMode('image')" class="relative z-10 flex-1 text-xs py-1.5 font-medium text-slate-500 transition-colors duration-300">
                            <i class="fa-solid fa-image mr-1"></i> สร้างภาพอ้างอิง
                        </button>
                    </div>
                </div>

                <!-- Textarea -->
                <div class="p-4 flex-grow flex flex-col relative">
                    <textarea id="prompt-output" class="w-full flex-grow min-h-[300px] p-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 font-medium text-sm leading-relaxed focus:ring-2 focus:ring-primary focus:border-primary outline-none resize-none transition-all" placeholder="คำสั่ง (Prompt) จะปรากฏที่นี่..."></textarea>
                    
                    <!-- Copy Alert -->
                    <div id="copy-toast" class="absolute top-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full text-sm font-medium shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none">
                        <i class="fa-solid fa-check-circle text-green-400 mr-1"></i> คัดลอกสำเร็จ!
                    </div>
                </div>

                <!-- Footer with Copy Button -->
                <div class="bg-slate-50 px-6 py-4 border-t border-slate-200">
                    <button onclick="copyPrompt()" class="w-full bg-gradient-to-r from-primary to-accent hover:from-primary hover:to-primary text-white font-bold py-3 px-4 rounded-xl shadow-lg transform hover:-translate-y-0.5 transition-all flex items-center justify-center text-lg">
                        <i class="fa-regular fa-copy mr-2"></i> คัดลอกไปใช้งานเลย
                    </button>
                    <p class="text-xs text-center text-slate-400 mt-3" id="helper-text">
                        <i class="fa-solid fa-circle-info"></i> คัดลอกข้อความพร้อมแนบรูปอ้างอิง เพื่อสร้างคลิปวิดีโอ
                    </p>
                </div>
            </div>

        </div>
    </main>

        let currentSubject = "";
        let currentTopic = "";
        let currentConcept = "";
        let currentMode = "video"; // 'video' or 'image'

        function init() {
            renderSubjects();
        }

        function setMode(mode) {
            currentMode = mode;
            const slider = document.getElementById('mode-slider');
            const videoBtn = document.getElementById('mode-video-btn');
            const imageBtn = document.getElementById('mode-image-btn');
            const helper = document.getElementById('helper-text');
            
            if (mode === 'video') {
                slider.style.transform = 'translateX(0)';
                videoBtn.className = 'relative z-10 flex-1 text-xs py-1.5 font-medium text-primary transition-colors duration-300';
                imageBtn.className = 'relative z-10 flex-1 text-xs py-1.5 font-medium text-slate-500 transition-colors duration-300';
                helper.innerHTML = '<i class="fa-solid fa-circle-info"></i> คัดลอกคำสั่งไปให้ AI (เช่น ChatGPT) เพื่อออกแบบ Storyboard ก่อนสร้างคลิปจริง';
            } else {
                slider.style.transform = 'translateX(100%)';
                imageBtn.className = 'relative z-10 flex-1 text-xs py-1.5 font-medium text-primary transition-colors duration-300';
                videoBtn.className = 'relative z-10 flex-1 text-xs py-1.5 font-medium text-slate-500 transition-colors duration-300';
                helper.innerHTML = '<i class="fa-solid fa-circle-info"></i> คัดลอกข้อความพร้อมแนบรูปคุณครู เพื่อสร้างภาพอ้างอิง';
            }
            generatePrompt();
        }

        function updateStyleInputs(subject) {
            let matched = styleMapping.find(m => m.keywords.includes("default"));
            for (let mapping of styleMapping) {
                for (let kw of mapping.keywords) {
                    if (subject.includes(kw)) {
                        matched = mapping;
                        break;
                    }
                }
            }
            
            document.getElementById('location-input').value = ideasData[subject].location + " ในประเทศไทย";
            document.getElementById('outfit-input').value = matched.outfit;
            document.getElementById('action-input').value = matched.action;
            
            document.getElementById('style-input').value = matched.style;
            document.getElementById('camera-input').value = matched.camera;
            document.getElementById('light-input').value = matched.light;
            document.getElementById('vibe-input').value = matched.vibe;
        }

        function renderSubjects() {
            const container = document.getElementById('subject-container');
            container.innerHTML = '';
            Object.keys(ideasData).forEach(subject => {
                const btn = document.createElement('button');
                btn.className = 'px-4 py-2 rounded-full border border-slate-200 text-sm font-medium transition-all focus:outline-none ' + (currentSubject === subject ? 'bg-primary text-white border-primary hover:bg-primary' : 'bg-white text-slate-700 hover:bg-slate-100');
                btn.innerText = subject;
                btn.onclick = () => selectSubject(subject);
                container.appendChild(btn);
            });
        }

        function selectSubject(subject) {
            currentSubject = subject;
            currentTopic = "";
            currentConcept = "";
            
            updateStyleInputs(subject);
            renderSubjects();
            renderIdeas();
            generatePrompt();
        }

        function renderIdeas() {
            const container = document.getElementById('ideas-container');
            container.innerHTML = '';
            if (!currentSubject || !ideasData[currentSubject]) return;

            ideasData[currentSubject].items.forEach((idea) => {
                const card = document.createElement('div');
                const cleanSubject = currentSubject.replace(/[^\u0E00-\u0E7Fa-zA-Z]/g, '').trim(); 
                
                card.className = 'idea-card bg-white border border-slate-200 rounded-xl p-4 cursor-pointer flex flex-col justify-between ' + (currentTopic === idea.topic ? 'active border-primary ring-1 ring-primary shadow-md' : '');
                card.onclick = () => selectIdea(idea.topic, idea.concept);
                
                card.innerHTML = '<div class="mb-2"><span class="text-xs font-semibold px-2 py-1 bg-slate-100 text-slate-600 rounded-md mb-2 inline-block">' + cleanSubject + '</span><h3 class="font-bold text-slate-800 text-md leading-tight">' + idea.topic + '</h3></div><p class="text-sm text-slate-500 font-medium mt-2 border-t border-slate-100 pt-2">' + idea.concept + '</p>';
                container.appendChild(card);
            });
        }

        function selectIdea(topic, concept) {
            currentTopic = topic;
            currentConcept = concept;
            renderIdeas();
            generatePrompt();
        }

        function generatePrompt() {
            const output = document.getElementById('prompt-output');
            
            if (!currentSubject || !currentTopic) {
                output.value = "";
                return;

            const cleanSubject = currentSubject.replace(/[^\u0E00-\u0E7Fa-zA-Z]/g, '').trim(); 
            const grade = document.getElementById('grade-level').value;
            
            const loc = document.getElementById('location-input').value;
            const outfit = document.getElementById('outfit-input').value;
            const action = document.getElementById('action-input').value;
            
            const style = document.getElementById('style-input').value;
            const camera = document.getElementById('camera-input').value;
            const light = document.getElementById('light-input').value;
            const vibe = document.getElementById('vibe-input').value;

            if (currentMode === 'video') {
                output.value = "คำสั่ง:\n" +
"ในฐานะ Agent ผู้เชี่ยวชาญด้านการผลิตสื่อการสอน (Google Flow) เป้าหมายของคุณคือการสร้างคลิปวิดีโอสื่อการสอนความยาว 30 วินาที (จำนวน 5 ฉาก ฉากละ 6 วินาที) โดยอ้างอิงจากรูปภาพต้นแบบที่คุณครูแนบมา (โปรดรักษาใบหน้าคุณครูต้นแบบไว้) และให้ดำเนินการตาม 3 ขั้นตอนดังต่อไปนี้อย่างต่อเนื่อง:\n\n" +
"ข้อกำหนดสำคัญ:\n" +
"⚠️ จำกัดการใช้ทรัพยากร: โปรดบริหารจัดการการสร้างภาพและวิดีโอให้ใช้เครดิต (Credits) รวมทั้งหมดไม่เกิน 50 เครดิต\n\n" +
"ข้อมูลเนื้อหา (Context):\n" +
"- วิชา: " + cleanSubject + "\n" +
"- เรื่อง: " + currentTopic + "\n" +
"- ตอน: \"" + currentConcept + "\"\n" +
"- ระดับชั้น: " + grade + "\n" +
"- สถานที่หลัก: " + loc + " บรรยากาศโรงเรียนไทย\n" +
"- การแต่งกายและท่าทาง: " + outfit + " / " + action + "\n" +
"- สไตล์ภาพ: " + style + "\n" +
"- แสงและบรรยากาศ: " + light + " / " + vibe + "\n\n" +
"---\n" +
"ขั้นตอนการทำงาน (Agent Workflow):\n\n" +
"Step 1: ออกแบบโครงร่าง (Storyboard & Script)\n" +
"กรุณาวิเคราะห์เนื้อหาและออกแบบ Storyboard 5 ฉาก นำเสนอเป็นตารางโดยมีรายละเอียด:\n" +
"- ลำดับฉาก (เวลา)\n" +
"- ภาพและแอคชั่น: อธิบายรายละเอียดเป็น **ภาษาไทย** (ให้ครูอ่านเข้าใจ) และแนบ **[Image/Video Prompt ภาษาอังกฤษ]** ในวงเล็บต่อท้าย (เพื่อใช้สร้างสื่อ)\n" +
"- การเคลื่อนกล้อง: อธิบายเป็น **ภาษาไทย** และแนบ **[Camera Movement ภาษาอังกฤษ]**\n" +
"- บทพากย์ (Voiceover): บทพากย์ **ภาษาไทยล้วน** (ความยาวพอดี 6 วินาที)\n" +
"*(เมื่อคุณนำเสนอ Step 1 เสร็จแล้ว ให้รอการยืนยัน หรือดำเนินการ Step 2 ต่อทันที)*\n\n" +
"Step 2: สร้างภาพนิ่ง (Image Generation)\n" +
"ใช้ [Image Prompt ภาษาอังกฤษ] ที่ออกแบบไว้ใน Step 1 มาสร้างภาพนิ่งจำนวน 5 ภาพ ตามลำดับฉาก โดยเน้นย้ำความสมจริง สภาพแวดล้อมบริบทแบบไทย และต้องใช้ภาพใบหน้าคุณครูที่แนบมาเป็นต้นแบบของตัวละครหลัก\n\n" +
"Step 3: สร้างวิดีโอ (Image-to-Video Generation)\n" +
"นำภาพนิ่งทั้ง 5 ภาพที่สร้างสำเร็จแล้ว มาทำให้เคลื่อนไหว (Animate) เป็นคลิปวิดีโอฉากละ 6 วินาที โดยใช้รูปแบบกล้อง [Camera Movement ภาษาอังกฤษ] ที่กำหนดไว้ใน Step 1";
            } else {
                output.value = "คำสั่ง:\n" + 
"กรุณาสร้างภาพอ้างอิงสำหรับใช้ทำคลิปสื่อการสอน โดยใช้ภาพที่ฉันแนบมานี้เป็นต้นแบบใบหน้าของคุณครู\n" + 
"โปรดเปลี่ยนเครื่องแต่งกายและจัดองค์ประกอบภาพให้เข้ากับเนื้อหาวิชา โดยเน้นย้ำว่าตัวละครต้องมีลักษณะเป็นคนไทย และสภาพแวดล้อมสะท้อนบริบทของประเทศไทยอย่างชัดเจน\n\n" +
"รายละเอียดเนื้อหา:\n" +
"- วิชา: " + cleanSubject + " \n" +
"- เรื่อง: " + currentTopic + " \n" +
"- ตอน: \"" + currentConcept + "\"\n" +
"- ระดับชั้น: " + grade + "\n\n" +
"องค์ประกอบภาพ (Visual Elements):\n" +
"- สถานที่: " + loc + " บรรยากาศแบบโรงเรียนในประเทศไทย\n" +
"- การแต่งกาย/อุปกรณ์: " + outfit + "\n" +
"- ท่าทาง (Action): " + action + "\n\n" +
"การตั้งค่าสไตล์ (Style Settings):\n" +
"- สไตล์ภาพ: " + style + "\n" +
"- มุมกล้อง: " + camera + " \n" +
"- แสง: " + light + " \n" +
"- บรรยากาศ: " + vibe;
            }
        }

        function copyPrompt() {
            const output = document.getElementById('prompt-output');
            if (!output.value) return;
            
            output.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            
            const toast = document.getElementById('copy-toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        window.onload = init;
    </script>
</body>
</html>
